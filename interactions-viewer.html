<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORA Coverage & Interaction Viewer</title>
<style>
:root{--ink:#17202a;--muted:#68727d;--line:#dce2e8;--paper:#fff;--wash:#f4f7f9;--brand:#155e75;--accent:#0891b2;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(120deg,#0f3d4c,#155e75);color:#fff;padding:28px max(24px,calc((100vw - 1440px)/2))}header h1{margin:0 0 5px;font-size:25px}header p{margin:0;color:#d7eef4}.toolbar,.dashboard,main{max-width:1440px;margin:auto;padding-left:24px;padding-right:24px}.toolbar{margin-top:18px;margin-bottom:18px;display:grid;grid-template-columns:2fr auto auto;gap:12px}input,select{border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:10px 12px;font:inherit}.dashboard{margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:12px}.card,.coverage-panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px}.card strong{display:block;font-size:25px;color:var(--brand)}.card span,.meta,.hint{color:var(--muted)}main{padding-bottom:40px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}aside,.content,.empty{background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:500px}aside{overflow:auto;max-height:calc(100vh - 155px);position:sticky;top:12px}.aside-title{padding:14px 16px 8px;font-weight:700}.interaction{width:100%;border:0;border-top:1px solid var(--line);text-align:left;padding:12px 16px;background:#fff;cursor:pointer}.interaction.active{background:#e9f7fa;box-shadow:inset 4px 0 var(--accent)}.interaction small{display:block;color:var(--muted);margin-top:3px}.content{padding:20px;min-width:0}.empty{grid-column:1/-1;display:grid;place-content:center;text-align:center;padding:40px;color:var(--muted);border-style:dashed}.empty strong{color:var(--ink);font-size:18px}.title-row{display:flex;gap:15px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}h2{margin:0;font-size:20px;overflow-wrap:anywhere}h3{margin:24px 0 10px;font-size:16px}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{border-radius:999px;background:#eef3f5;padding:4px 9px;white-space:nowrap}.pill.good{background:#e5f6ec;color:#176b3a}.pill.missing{background:#fff0ed;color:#9b2c20}.coverage-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px}.coverage-item{padding:10px;background:#f7fafb;border-radius:8px}.coverage-item strong{display:block}.bar{height:7px;background:#dce6e9;border-radius:9px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.record{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}.record-head{padding:11px 13px;background:#fafcfd;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.record-head .spacer{flex:1}.summary{padding:13px;display:grid;gap:9px}.field{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:12px}.field-name{color:var(--muted);font-weight:650}.value{white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid var(--line)}summary{cursor:pointer;padding:10px 13px;color:var(--brand);font-weight:650}pre{margin:0;padding:14px;background:#102027;color:#d7edf2;overflow:auto;max-height:520px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.error{display:none;color:var(--bad);padding:12px max(24px,calc((100vw - 1440px)/2));background:#feeceb}.notice{max-width:1440px;margin:14px auto;padding:12px 24px;color:var(--brand)}mark{background:#ffe08a}@media(max-width:800px){.toolbar,.cards,.coverage-grid,main{grid-template-columns:1fr}aside{position:static;max-height:260px;min-height:0}}
</style>
</head>
<body>
<header><h1>NORA Coverage & Interaction Viewer</h1><p>Disk-backed viewer for very large interaction exports.</p></header>
<div id="error" class="error"></div>
<div id="notice" class="notice">Connecting to the local viewer index…</div>
<section class="toolbar">
<input id="search" type="search" placeholder="Search interaction/CID…" disabled>
<select id="source" disabled><option value="">All sources</option><option value="chat_history">Chat history</option><option value="context_history">Context history</option><option value="tool_history">Tool history</option><option value="feedback">Feedback</option></select>
<select id="relationship" disabled><option value="">All relationship states</option><option value="complete">Complete: all 4 containers</option><option value="incomplete">Incomplete</option><option value="missing:context">Missing context</option><option value="missing:tools">Missing tools</option><option value="missing:feedback">Missing feedback</option></select>
</section>
<section id="dashboard" class="dashboard"></section>
<main id="app"><div class="empty"><strong>Starting viewer…</strong><span>The 4 GB CSV stays on disk. Only the selected interaction is loaded into the browser.</span></div></main>
<script>
(()=>{
const sourceLabels={chat_history:'Chat history',context_history:'Context history (Agent)',tool_history:'Tool history',feedback:'Feedback'};
const preferred=['agent','function_name','function_arguments','function_result','arguments','result','error','content','message','response','rca_feedback','resolution','reasoning','gap_type','confidence_score','criticality','status'];
const state={groups:[],selected:null,query:'',source:'',relationship:'',summary:{},loading:false};
const app=document.querySelector('#app'),dashboard=document.querySelector('#dashboard'),error=document.querySelector('#error'),notice=document.querySelector('#notice'),search=document.querySelector('#search'),source=document.querySelector('#source'),relationship=document.querySelector('#relationship');
search.oninput=e=>{state.query=e.target.value.trim().toLowerCase();renderList();};source.onchange=e=>{state.source=e.target.value;renderList();};relationship.onchange=e=>{state.relationship=e.target.value;renderList();};
init();
async function init(){
 try{
   const status=await fetchJSON('/api/status');
   if(!status.ok)throw new Error('Viewer API not available.');
   notice.textContent='Large-file mode active. Records are loaded from SQLite only when you select a CID.';
   const payload=await fetchJSON('/api/coverage');
   state.summary=payload.summary||{};
   state.groups=(payload.coverage||[]).map(r=>({id:r.interaction_id,coverage:r,records:null}));
   search.disabled=source.disabled=relationship.disabled=false;
   state.selected=state.groups[0]?.id||null;
   renderDashboard();renderList();
 }catch(ex){
   showError(ex.message||String(ex));
   notice.innerHTML='For multi-GB CSVs run <strong>python csv_coverage_report.py output\\interactions.csv</strong>, then <strong>python interaction_viewer_server.py --db output\\interactions_viewer.sqlite3</strong>, and open http://127.0.0.1:8765/';
   app.innerHTML='<div class="empty"><strong>Local viewer server is not running</strong><span>Do not select the 4 GB CSV directly in the browser.</span></div>';
 }
}
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`Request failed: ${r.status}`);return r.json();}
function filtered(){return state.groups.filter(g=>!state.query||g.id.toLowerCase().includes(state.query)).filter(g=>matchesRelationship(g.coverage)).filter(g=>!state.source||Number(g.coverage?.[`${state.source}_records`]||0)>0);}
function matchesRelationship(r){if(!state.relationship)return true;const c=Number(r.has_context_history)>0,t=Number(r.has_tool_history)>0,f=Number(r.has_feedback)>0;if(state.relationship==='complete')return c&&t&&f;if(state.relationship==='incomplete')return !(c&&t&&f);if(state.relationship==='missing:context')return !c;if(state.relationship==='missing:tools')return !t;if(state.relationship==='missing:feedback')return !f;return true;}
function renderList(){const visible=filtered();if(!visible.length){app.innerHTML='<div class="empty"><strong>No matching interactions</strong><span>Try another filter.</span></div>';return;}if(!visible.some(g=>g.id===state.selected))state.selected=visible[0].id;const active=visible.find(g=>g.id===state.selected);app.innerHTML=`<aside><div class="aside-title">${visible.length} of ${state.groups.length} interactions</div>${visible.map(g=>`<button class="interaction ${g.id===state.selected?'active':''}" data-id="${esc(g.id)}"><strong>${highlight(g.id)}</strong><small>${g.coverage.referenced_container_count}/3 relationships · ${totalRecords(g.coverage)} records</small></button>`).join('')}</aside><section class="content" id="detail">${renderCoverage(active)}</section>`;app.querySelectorAll('.interaction').forEach(b=>b.onclick=()=>selectInteraction(b.dataset.id));if(active.records)renderDetail(active);else selectInteraction(active.id);}
async function selectInteraction(id){state.selected=id;const group=state.groups.find(g=>g.id===id);if(!group)return;document.querySelectorAll('.interaction').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const detail=document.querySelector('#detail');if(detail)detail.innerHTML=renderCoverage(group)+'<p class="hint">Loading records…</p>';if(!group.records){try{const p=await fetchJSON('/api/interaction?id='+encodeURIComponent(id));group.records=p.records||[];}catch(ex){showError(ex.message);group.records=[];}}renderDetail(group);}
function renderDetail(group){const detail=document.querySelector('#detail');if(!detail)return;const records=(group.records||[]).filter(r=>!state.source||r.source===state.source);const sections=[...new Set(records.map(r=>r.source))].map(type=>`<h3>${esc(sourceLabels[type]||type)} <span class="pill">${records.filter(r=>r.source===type).length}</span></h3>${records.filter(r=>r.source===type).map(renderRecord).join('')}`).join('');detail.innerHTML=renderCoverage(group)+(sections||'<p class="hint">No records for the selected source.</p>');}
function renderCoverage(group){const r=group.coverage,items=[['chat_history','Chat history'],['context_history','Context history'],['tool_history','Tool history'],['feedback','Feedback']];return `<div class="title-row"><div><h2>${highlight(group.id)}</h2><div class="meta">${totalRecords(r)} indexed source records</div></div></div><h3>Relationship coverage</h3><div class="coverage-panel"><div class="coverage-grid">${items.map(([k,n])=>{const c=Number(r[`${k}_records`]||0);return `<div class="coverage-item"><strong>${esc(n)}</strong><div>${c} record${c===1?'':'s'}</div><span class="pill ${c?'good':'missing'}">${c?'Matched':'Missing'}</span></div>`}).join('')}</div></div>`;}
function totalRecords(r){return ['chat_history','context_history','tool_history','feedback'].reduce((a,k)=>a+Number(r?.[`${k}_records`]||0),0);}
function renderRecord(row){const parsed=parseJSON(row.data),id=row.record_id||parsed?.id||'Record',meta=[row.cid&&`CID: ${row.cid}`,row.run_id&&`Run: ${row.run_id}`].filter(Boolean);let body='';if(parsed){const fields=meaningfulFields(parsed);body=fields.length?fields.map(([k,v])=>`<div class="field"><div class="field-name">${esc(label(k))}</div><div class="value">${highlight(display(v))}</div></div>`).join(''):'<span class="hint">Expand Complete JSON for full details.</span>';}else body='<span class="hint">Invalid JSON in this record.</span>';return `<article class="record"><div class="record-head"><strong>${highlight(id)}</strong><span class="spacer"></span>${meta.map(x=>`<span class="pill">${highlight(x)}</span>`).join('')}</div><div class="summary">${body}</div><details><summary>Complete JSON</summary><pre>${highlight(parsed?JSON.stringify(parsed,null,2):row.data)}</pre></details></article>`;}
function parseJSON(v){try{return JSON.parse(v)}catch{return null}}
function meaningfulFields(value){const found=new Map();walk(value,'',found);return [...found].sort((a,b)=>{const ai=preferred.indexOf(a[0].split('.').pop()),bi=preferred.indexOf(b[0].split('.').pop());return(ai<0?999:ai)-(bi<0?999:bi)}).slice(0,18)}
function walk(value,path,out){if(out.size>80)return;if(Array.isArray(value)){value.slice(0,20).forEach((v,i)=>walk(v,`${path}[${i}]`,out));return}if(value&&typeof value==='object'){for(const[k,v]of Object.entries(value)){const p=path?`${path}.${k}`:k;if(preferred.includes(k)&&useful(v)&&!out.has(p))out.set(p,v);walk(v,p,out)}}}
function useful(v){return v!==null&&v!==''&&(!(Array.isArray(v))||v.length)&&(!(typeof v==='object'&&!Array.isArray(v))||Object.keys(v).length)}function display(v){return typeof v==='string'?v:JSON.stringify(v,null,2)}function label(p){return p.replace(/\[(\d+)\]/g,' #$1').split('.').map(x=>x.replace(/_/g,' ')).join(' › ')}
function renderDashboard(){const s=state.summary||{},cards=[['Chat CIDs analyzed',s.distinct_chat_cids_analyzed||0],['Complete interactions',s.complete_all_four_containers||0],['Incomplete interactions',s.incomplete_interactions||0],['Complete coverage',`${s.complete_coverage_percent||0}%`]],containers=[['chat_history','Chat history'],['context_history','Context history'],['tool_history','Tool history'],['feedback','Feedback']];dashboard.innerHTML=`<div class="cards">${cards.map(([l,v])=>`<div class="card"><strong>${esc(v)}</strong><span>${esc(l)}</span></div>`).join('')}</div><div class="coverage-panel"><h2>Container coverage</h2><div class="coverage-grid">${containers.map(([key,label])=>{const m=s.sources?.[key]||{},cids=Number(m.cids_with_match||0),records=Number(m.total_records||0),pct=Number(m.coverage_percent||0);return `<div class="coverage-item"><strong>${esc(label)}</strong><div>${cids.toLocaleString()} CIDs · ${records.toLocaleString()} records</div><div class="bar"><i style="width:${Math.min(100,Math.max(0,pct))}%"></i></div><span>${pct}% coverage</span></div>`}).join('')}</div></div>`;}
function highlight(v){const safe=esc(String(v??''));if(!state.query)return safe;const q=state.query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return safe.replace(new RegExp(`(${q})`,'ig'),'<mark>$1</mark>')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showError(m){error.textContent=m;error.style.display='block'}
})();
</script>
</body>
</html>
